<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Jogniya Motors</title>
    <link rel="stylesheet" href="./css/admin.css">
</head>
<body class="login-page">

    <div class="login-container">

        <div class="login-brand">
            <h1>JOGNIYA <span>MOTORS</span></h1>
            <p>ADMINISTRATION PANEL</p>
        </div>

        <div class="login-card">
            <h2>Welcome Back</h2>
            <p class="login-subtitle">Login to manage your showroom</p>

            <form id="adminLoginForm">

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input
                        type="email"
                        id="email"
                        placeholder="Enter admin email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        placeholder="Enter password"
                        required
                    >
                </div>

                <p id="loginMessage" class="login-message"></p>

                <button type="submit" id="loginButton">
                    Login to Dashboard
                </button>

            </form>

            <a href="./index.html" class="back-home">
                ← Back to Website
            </a>
        </div>

        <p class="login-footer">
            © 2026 Jogniya Motors. All Rights Reserved.
        </p>

    </div>

    <script src="./js/admin.js"></script>
</body>
</html>
